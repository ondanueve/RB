<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15110e">
<title>No encontrado — rayo borgesdebioyizador</title>
<style>html{background:#15110e;color:#efe4cc;font-family:Georgia,serif}body{max-width:34rem;margin:20vh auto;padding:0 1.5rem;line-height:1.6}a{color:#d4a850}</style>
<script>
  // /RB/p/<id> (permalink corto viejo) -> /RB/d/<id>/ (página estática con vista previa).
  // /RB/d/<id>/ que todavía no existe (diario recién creado, antes del próximo build) -> /RB/?id=<id>.
  (function () {
    var p = location.pathname.match(/^\/RB\/p\/([2-9A-Za-z]{6,24})\/?$/);
    if (p) return location.replace("/RB/d/" + p[1] + "/" + location.hash);
    var d = location.pathname.match(/^\/RB\/d\/([2-9A-Za-z]{6,24})\/?$/);
    if (d) location.replace("/RB/?id=" + d[1] + location.hash);
  })();
</script>
</head>
<body>
<h1>No encontrado</h1>
<p>Esta página no existe. <a href="/RB/">Volver al generador de diarios apócrifos</a>.</p>
</body>
</html>
